<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>Schools</title>
		<style>
:root {
	--bg: #ececec;
	--fg: #666;
	--ic: #333;
	color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #1a1a1a;
		--fg: #999;
		--ic: #ddd;
	}
}
body, html {
	margin: 0;
	background: var(--bg);
}
body {
	display: grid;
	place-items: center;
	padding: 24px 12px;
	font: 12px/1.5 system-ui, sans-serif;
	color: var(--fg);
}
main {
	width: min(100%, 860px);
	display: grid;
	gap: 14px;
	justify-items: center;
}
svg#chart {
	width: 100%;
	height: auto;
	display: block;
	box-shadow: 0 2px 20px #0003;
	user-select: none;
}
.bar {
	display: flex;
	align-items: center;
	gap: 4px;
	margin-bottom: 10px;
	min-height: 32px;
}
.bar .sp {
	flex: 1;
	text-align: center;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
.bar button {
	display: grid;
	place-items: center;
	width: 32px;
	height: 32px;
	padding: 0;
	border: 0;
	border-radius: 6px;
	background: 0 0;
	color: var(--ic);
	cursor: pointer;
}
.bar button:hover:not(:disabled) {
	background: #8882;
}
.bar button:focus-visible {
	outline: 2px solid #185fa5;
}
.bar button:disabled {
	opacity: 0.3;
	cursor: default;
}
footer {
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	gap: 6px 28px;
}
kbd {
	font: inherit;
	border: 1px solid currentColor;
	border-radius: 3px;
	padding: 0 4px;
	opacity: 0.85;
}
.ctl, .gh {
	opacity: 0;
	transition: opacity 0.12s;
}
.row:hover .ctl, .row:hover .gh {
	opacity: 1;
}
.ctl {
	cursor: pointer;
}
.ctl circle {
	fill: #fff;
	stroke: #aaa;
}
.ctl text {
	font: 11px sans-serif;
	fill: #555;
	text-anchor: middle;
	dominant-baseline: central;
	pointer-events: none;
}
.ctl:hover circle {
	fill: #185fa5;
	stroke: #185fa5;
}
.ctl:hover text {
	fill: #fff;
}
.ctl.on circle {
	stroke: #185fa5;
}
.gh {
	fill: none;
	stroke: #999;
	stroke-width: 0.8;
	stroke-dasharray: 2 2;
	pointer-events: none;
}
.hit {
	fill: transparent;
	cursor: pointer;
}
.grab {
	cursor: grab;
}
.ui input {
	display: block;
	box-sizing: border-box;
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0 0 0 2px;
	border: 0;
	outline: 0;
	border-radius: 2px;
	background: 0 0;
	color: transparent;
	caret-color: #185fa5;
	font: 14px/20px "DejaVu Serif", Georgia, serif;
	user-select: text;
}
.ui input:hover {
	background: #185fa510;
}
.ui input:focus {
	background: #185fa51a;
}
.ui input::selection {
	background: #185fa540;
	color: transparent;
}
.ui input.hd {
	text-align: center;
	padding: 0;
}
#t {
	position: fixed;
	bottom: 18px;
	left: 50%;
	translate: -50% 0;
	background: #222;
	color: #fff;
	padding: 6px 12px;
	border-radius: 6px;
	opacity: 0;
	transition: opacity 0.2s;
	pointer-events: none;
}
#t.show {
	opacity: 1;
}
@media print {
	@page {
		margin: 12mm;
	}
	body, html {
		background: #fff;
	}
	body {
		display: block;
		padding: 0;
	}
	main {
		width: 100%;
		display: block;
	}
	#t, .bar, .ui, footer {
		display: none !important;
	}
	svg#chart {
		box-shadow: none;
		-webkit-print-color-adjust: exact;
		print-color-adjust: exact;
	}
}
		</style>
